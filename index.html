<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splitzy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-box">

        <div class="left-section">

            <h1>Splitzy</h1>

            <p class="sub-text">
                Split expenses easily with your friends and groups.
            </p>

            <div class="card">
                <h2>Add People</h2>

                <input type="text" id="personInput" placeholder="Enter person name">

                <button id="addPersonBtn">Add Person</button>
            </div>

            <div class="card">
                <h2>Add Expense</h2>

                <input type="text" id="expenseTitle" placeholder="Expense title">

                <input type="number" id="expenseAmount" placeholder="Amount">

                <button id="addExpenseBtn">Add Expense</button>
            </div>

        </div>
